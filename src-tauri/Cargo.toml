[package]
name = "rynox-ide"
version = "0.1.0"
description = "Codexis IDE: the Code tab of the AI chat as a desktop app"
edition = "2021"

[lib]
name = "rynox_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.41.1", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
