name: Tag

on:
    push:
    workflow_dispatch:
        inputs:
            release_tag:
                description: Existing tag (vX.Y.Z) to build and publish a release for. Leave empty to tag the latest commit as usual.
                required: false
                default: ''

permissions:
    contents: write

concurrency:
    group: tag
    cancel-in-progress: false

jobs:
    # * Tags the pushed commit as v<next patch> (0.1.0 -> v0.1.1) when a push to the default branch changes frontend or backend code. It creates no commit, only a tag. It does not create a GitHub Release (that needs signing and latest.json). Pushes made with GITHUB_TOKEN do not trigger other workflows.
    tag:
        # * `on.push.branches` cannot read the default branch, so the branch is checked here.
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.release_tag == ''
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            released: ${{ steps.bump.outputs.released }}
            tag: ${{ steps.bump.outputs.tag }}
            version: ${{ steps.bump.outputs.version }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0

            - name: Create next version tag
              id: bump
              env:
                  COMMIT_SHA: ${{ github.sha }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  EVENT: ${{ github.event_name }}
                  BEFORE: ${{ github.event.before }}
              run: |
                  echo "released=false" >> "$GITHUB_OUTPUT"

                  # * Only frontend or backend code changes release (same path filter as build.yml). A manual run, a new branch or an unreadable base counts as changed.
                  if [ "$EVENT" != "workflow_dispatch" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                    files=$(git diff --name-only "$BEFORE" "$COMMIT_SHA")
                    echo "$files"
                    if ! echo "$files" | grep -qE '^(src/|public/|index\.html$|package\.json$|pnpm-lock\.yaml$|vite\.config\.ts$|tsconfig.*\.json$|eslint\.config\.js$|\.prettier)|^src-tauri/'; then
                      echo "::notice::No frontend or backend code changed, so no new version."
                      exit 0
                    fi
                  fi

                  semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

                  # * This commit already has a release tag (a re-run): stop quietly.
                  existing=$(git tag --points-at "$COMMIT_SHA" | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | head -n 1 || true)
                  if [ -n "$existing" ]; then
                    echo "Commit already tagged $existing, skipping."
                    exit 0
                  fi

                  # * The base version in tauri.conf.json is the floor; the next patch comes from the highest v<X.Y.Z> tag. Other tag names are ignored and versions are compared as numbers.
                  base_version=$(jq -r '.version' src-tauri/tauri.conf.json)
                  if ! echo "$base_version" | grep -qE "$semver"; then
                    echo "::error::Version '$base_version' in src-tauri/tauri.conf.json is not plain X.Y.Z (no suffix allowed)."
                    exit 1
                  fi

                  tag_versions=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's|.*refs/tags/v||' | grep -E "$semver" || true)
                  highest=$(printf '%s\n%s\n' "$base_version" "$tag_versions" | grep -E "$semver" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)

                  major=${highest%%.*}
                  rest=${highest#*.}
                  minor=${rest%%.*}
                  patch=${rest#*.}
                  version="$major.$minor.$((patch + 1))"
                  tag="v$version"

                  # * Only a tag is pushed, never a commit, so branch rulesets that require pull requests do not block it. No force: an existing tag makes the push fail.
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "$tag" "$COMMIT_SHA" -m "Release $tag"
                  if ! git push origin "refs/tags/$tag"; then
                    echo "::error::Could not push tag $tag. Check that the token may create tags (a tag ruleset can block it) and that the tag does not already exist."
                    exit 1
                  fi
                  {
                    echo "released=true"
                    echo "tag=$tag"
                    echo "version=$version"
                  } >> "$GITHUB_OUTPUT"
                  echo "Tagged $tag on $COMMIT_SHA."

    # * Publishes the GitHub Release when a new tag was just created, or for an existing tag given as `release_tag` on a manual run. It lives in this workflow because a tag pushed with GITHUB_TOKEN does not trigger others. Without the signing secret the release has the .dmg/.app only (no updater files).
    release:
        needs: tag
        if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (needs.tag.outputs.released == 'true' || inputs.release_tag != '') }}
        runs-on: macos-latest
        timeout-minutes: 60
        permissions:
            contents: write
        env:
            # * Secrets cannot be read in `if:`, so the steps test this flag instead.
            HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
            NEW_TAG: ${{ needs.tag.outputs.tag }}
            INPUT_TAG: ${{ inputs.release_tag }}
        steps:
            - id: resolve
              run: |
                  tag="${INPUT_TAG:-$NEW_TAG}"
                  if ! echo "$tag" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
                    echo "::error::Tag '$tag' is not in the form vX.Y.Z."
                    exit 1
                  fi
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

            - if: env.HAS_SIGNING_KEY != 'true'
              run: echo "::notice::No signing secret, so the release has only the .dmg/.app and the in-app update does not work yet."

            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  ref: ${{ steps.resolve.outputs.tag }}

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 10

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
              with:
                  workspaces: src-tauri

            - run: pnpm install --frozen-lockfile

            # * The tag version (and, without a signing key, no updater files) is passed as a config override, so no file in the repo changes.
            - env:
                  VERSION: ${{ steps.resolve.outputs.version }}
              run: |
                  jq -n --arg version "$VERSION" --arg signed "$HAS_SIGNING_KEY" 'if $signed == "true" then {version: $version} else {version: $version, bundle: {createUpdaterArtifacts: false}} end' > "$RUNNER_TEMP/version.json"

            - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  tagName: ${{ steps.resolve.outputs.tag }}
                  releaseName: Codexis IDE v${{ steps.resolve.outputs.version }}
                  releaseDraft: false
                  prerelease: false
                  includeUpdaterJson: ${{ env.HAS_SIGNING_KEY == 'true' }}
                  args: --config ${{ runner.temp }}/version.json
