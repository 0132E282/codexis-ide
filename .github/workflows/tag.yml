name: Tag

on:
    push:
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: tag
    cancel-in-progress: false

jobs:
    # * Bumps the patch version (0.1.0 -> 0.1.1) on a push to the default branch that changes frontend or backend code, commits it and tags it as v<version>. It does not create a GitHub Release (that needs signing and latest.json). Pushes made with GITHUB_TOKEN do not trigger other workflows.
    tag:
        # * `on.push.branches` cannot read the default branch, so the branch is checked here.
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            released: ${{ steps.bump.outputs.released }}
            tag: ${{ steps.bump.outputs.tag }}
            version: ${{ steps.bump.outputs.version }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0

            - name: Bump patch version and tag
              id: bump
              env:
                  COMMIT_SHA: ${{ github.sha }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  EVENT: ${{ github.event_name }}
                  BEFORE: ${{ github.event.before }}
              run: |
                  echo "released=false" >> "$GITHUB_OUTPUT"

                  # * Skip the release commit made by this workflow, so it never loops.
                  subject=$(git log -1 --format=%s "$COMMIT_SHA")
                  author=$(git log -1 --format=%ae "$COMMIT_SHA")
                  if [ "$author" = "41898282+github-actions[bot]@users.noreply.github.com" ] && echo "$subject" | grep -qE '^chore: phát hành v[0-9]'; then
                    echo "Release commit, skipping."
                    exit 0
                  fi

                  # * Only frontend or backend code changes release (same path filter as build.yml). A manual run, a new branch or an unreadable base counts as changed.
                  if [ "$EVENT" != "workflow_dispatch" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                    files=$(git diff --name-only "$BEFORE" "$COMMIT_SHA")
                    echo "$files"
                    if ! echo "$files" | grep -qE '^(src/|public/|index\.html$|package\.json$|pnpm-lock\.yaml$|vite\.config\.ts$|tsconfig.*\.json$|eslint\.config\.js$|\.prettier)|^src-tauri/'; then
                      echo "::notice::No frontend or backend code changed, so no new version."
                      exit 0
                    fi
                  fi

                  semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
                  tauri_version=$(jq -r '.version' src-tauri/tauri.conf.json)
                  cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
                  lock_version=$(awk '/^name = "codexis-ide"$/ { found = 1; next } found && /^version = / { gsub(/version = |"/, ""); print; exit }' src-tauri/Cargo.lock)

                  # * Fail without changing anything when a version is not plain X.Y.Z or the three files disagree.
                  for value in "$tauri_version" "$cargo_version" "$lock_version"; do
                    if ! echo "$value" | grep -qE "$semver"; then
                      echo "::error::Version '$value' is not plain X.Y.Z (no suffix allowed)."
                      exit 1
                    fi
                  done

                  if [ "$tauri_version" != "$cargo_version" ] || [ "$tauri_version" != "$lock_version" ]; then
                    echo "::error::Version mismatch: tauri.conf.json '$tauri_version', Cargo.toml '$cargo_version', Cargo.lock '$lock_version'."
                    exit 1
                  fi

                  major=${tauri_version%%.*}
                  rest=${tauri_version#*.}
                  minor=${rest%%.*}
                  patch=${rest#*.}
                  version="$major.$minor.$((patch + 1))"
                  tag="v$version"

                  # * An existing tag on the default branch is left untouched (no overwrite, no force). One outside its history is an orphan from a rejected push, so fail loudly.
                  if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
                    git fetch --quiet origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
                    if git merge-base --is-ancestor "refs/tags/$tag^{commit}" "origin/$DEFAULT_BRANCH"; then
                      echo "Tag $tag already exists, skipping."
                      exit 0
                    fi
                    echo "::error::Tag $tag exists but is not in the history of $DEFAULT_BRANCH (orphan tag, likely from an earlier rejected push). Delete the tag, then run again."
                    exit 1
                  fi

                  # * Edit only the version lines; Cargo.lock is patched by hand so no dependency changes.
                  awk -v old="$tauri_version" -v new="$version" '!done && $0 == "  \"version\": \"" old "\"," { print "  \"version\": \"" new "\","; done = 1; next } { print }' src-tauri/tauri.conf.json > tauri.conf.tmp
                  mv tauri.conf.tmp src-tauri/tauri.conf.json
                  awk -v old="$cargo_version" -v new="$version" '!done && $0 == "version = \"" old "\"" { print "version = \"" new "\""; done = 1; next } { print }' src-tauri/Cargo.toml > Cargo.toml.tmp
                  mv Cargo.toml.tmp src-tauri/Cargo.toml
                  awk -v new="$version" '/^name = "codexis-ide"$/ { found = 1 } found && /^version = / { print "version = \"" new "\""; found = 0; next } { print }' src-tauri/Cargo.lock > Cargo.lock.tmp
                  mv Cargo.lock.tmp src-tauri/Cargo.lock

                  if [ "$(jq -r '.version' src-tauri/tauri.conf.json)" != "$version" ] || ! grep -q "^version = \"$version\"\$" src-tauri/Cargo.toml || ! grep -q "^version = \"$version\"\$" src-tauri/Cargo.lock; then
                    echo "::error::Version files were not updated to $version."
                    exit 1
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
                  git commit -m "chore: phát hành $tag [skip ci]"
                  git tag -a "$tag" -m "Release $tag"

                  # * One atomic push of commit and tag (no force): if the branch is rejected, the tag is not created either. Fail instead of retrying.
                  if ! git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$tag"; then
                    echo "::error::Push rejected, nothing was pushed or retried. Common cause: a ruleset or branch protection on $DEFAULT_BRANCH requires a pull request, so add github-actions to its bypass list. Otherwise $DEFAULT_BRANCH has newer commits."
                    exit 1
                  fi
                  {
                    echo "released=true"
                    echo "tag=$tag"
                    echo "version=$version"
                  } >> "$GITHUB_OUTPUT"
                  echo "Tagged $tag."

    # * Publishes the GitHub Release (updater files for the in-app update) only when a new tag was just created. It lives in this workflow because a tag pushed with GITHUB_TOKEN does not trigger others.
    release:
        needs: tag
        if: needs.tag.outputs.released == 'true'
        runs-on: macos-latest
        timeout-minutes: 60
        permissions:
            contents: write
        env:
            # * Secrets cannot be read in `if:`, so the step conditions test this flag instead.
            HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
            TAG: ${{ needs.tag.outputs.tag }}
            VERSION: ${{ needs.tag.outputs.version }}
        steps:
            - if: env.HAS_SIGNING_KEY != 'true'
              run: echo "::notice::No signing secret, so no release was created (only the tag)."

            - if: env.HAS_SIGNING_KEY == 'true'
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  ref: ${{ needs.tag.outputs.tag }}

            - if: env.HAS_SIGNING_KEY == 'true'
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 10

            - if: env.HAS_SIGNING_KEY == 'true'
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22
                  cache: pnpm

            - if: env.HAS_SIGNING_KEY == 'true'
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

            - if: env.HAS_SIGNING_KEY == 'true'
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
              with:
                  workspaces: src-tauri

            - if: env.HAS_SIGNING_KEY == 'true'
              run: pnpm install --frozen-lockfile

            - if: env.HAS_SIGNING_KEY == 'true'
              uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  tagName: ${{ needs.tag.outputs.tag }}
                  releaseName: Codexis IDE v${{ needs.tag.outputs.version }}
                  releaseDraft: false
                  prerelease: false
                  includeUpdaterJson: true
