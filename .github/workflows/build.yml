name: Build

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: macos-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 10

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
              with:
                  workspaces: src-tauri

            - run: pnpm install --frozen-lockfile

            - run: pnpm lint

            - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

            - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

            - run: pnpm build

            - run: cargo test --manifest-path src-tauri/Cargo.toml

    build:
        needs: test
        runs-on: macos-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 10

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
              with:
                  workspaces: src-tauri

            - run: pnpm install --frozen-lockfile

            - run: pnpm tauri build

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: rynox-ide-macos
                  path: src-tauri/target/release/bundle/macos/*.app
                  if-no-files-found: error
